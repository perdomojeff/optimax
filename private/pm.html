<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>*,*::before,*::after{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0}</style>
<title>StrataFlow · Project Manager</title>

<style>
/* Vista restringida para aliados de SAI Group: solo Project Manager (registro de horas). Sin edición ni borrado. */
:root{--bg:#021b31;--panel:#032c4d;--panel2:#063a60;--line:#0e4a70;--fg:#f4f8fa;--muted:#8fb4c6;--accent:#7eb7cc;--on-accent:#021b31;--good:#4fbf9f;--warn:#d9a860;--crit:#f0776c}
body{background:var(--bg);color:var(--fg);font:14px/1.5 "IBM Plex Sans",system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 80px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
h1{margin:4px 0 0;font:700 clamp(38px,6vw,58px)/.95 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.14em}
.sub{color:var(--accent);font:500 clamp(16px,2.4vw,21px) "Barlow Condensed","Arial Narrow",sans-serif}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:16px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{background:none;border:0;border-bottom:2px solid var(--accent);color:var(--fg);padding:8px 14px;font:600 14px inherit;cursor:default}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
label{display:block;font-size:13px;font-weight:500;margin-bottom:4px}
input,textarea,select{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;font:13px inherit}
textarea{resize:vertical}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);border-radius:6px;padding:7px 13px;font:500 13px inherit;cursor:pointer}
.btn.prim{background:var(--accent);border-color:var(--accent);color:var(--on-accent,#1a1205);font-weight:600}
.btn:disabled{opacity:.5;cursor:not-allowed}
.hint{color:var(--muted);font-size:12px;margin:6px 0 0}
.err{color:var(--crit);font-size:13px;margin-top:8px}.ok{color:var(--good);font-size:13px;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:8px 10px;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);vertical-align:top}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
.wk{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 6px}
.wk b{font-size:14px}.scroll{overflow-x:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:var(--panel2);color:var(--fg);border:0;padding:5px 10px;cursor:pointer;font:500 13px inherit}.seg button[aria-pressed=true]{background:var(--accent);color:var(--on-accent,#1a1205);font-weight:600}
</style>

    thBtn.innerHTML = light ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>' : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
    var top = el('div', { class: 'top' }, el('div', {}, el('div', { class: 'eyebrow', text: t('eyebrow') }), el('h1', { text: 'STRATAFLOW' }), el('div', { class: 'sub', text: t('sub') })), el('div', { style: 'display:flex;gap:8px;align-items:center' }, thBtn, langSeg));

    var fProj = el('input', { id: 'pr', type: 'text', maxlength: '120', value: draft.project }); fProj.oninput = function () { draft.project = fProj.value; };
    var fHrs = el('input', { id: 'h', type: 'number', step: '0.25', min: '0.25', max: '24', inputmode: 'decimal', placeholder: t('ph'), value: draft.horas }); fHrs.oninput = function () { draft.horas = fHrs.value; };
