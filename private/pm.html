<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>*,*::before,*::after{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0}</style>
<title>StrataFlow · Project Manager</title>
<script src="/theme.js"></script>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
/* Vista restringida para aliados de SAI Group: solo Project Manager (registro de horas). Sin edición ni borrado. */
:root{--bg:#021b31;--panel:#032c4d;--panel2:#063a60;--line:#0e4a70;--fg:#f4f8fa;--muted:#8fb4c6;--accent:#7eb7cc;--on-accent:#021b31;--good:#4fbf9f;--warn:#d9a860;--crit:#f0776c}
body{background:var(--bg);color:var(--fg);font:14px/1.5 "IBM Plex Sans",system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 80px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
h1{margin:4px 0 0;font:700 clamp(38px,6vw,58px)/.95 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.14em}
.sub{color:var(--accent);font:500 clamp(16px,2.4vw,21px) "Barlow Condensed","Arial Narrow",sans-serif}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:16px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{background:none;border:0;border-bottom:2px solid var(--accent);color:var(--fg);padding:8px 14px;font:600 14px inherit;cursor:default}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
label{display:block;font-size:13px;font-weight:500;margin-bottom:4px}
input,textarea,select{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;font:13px inherit}
textarea{resize:vertical}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);border-radius:6px;padding:7px 13px;font:500 13px inherit;cursor:pointer}
.btn.prim{background:var(--accent);border-color:var(--accent);color:var(--on-accent,#1a1205);font-weight:600}
.btn:disabled{opacity:.5;cursor:not-allowed}
.hint{color:var(--muted);font-size:12px;margin:6px 0 0}
.err{color:var(--crit);font-size:13px;margin-top:8px}.ok{color:var(--good);font-size:13px;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:8px 10px;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);vertical-align:top}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
.wk{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 6px}
.wk b{font-size:14px}.scroll{overflow-x:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:var(--panel2);color:var(--fg);border:0;padding:5px 10px;cursor:pointer;font:500 13px inherit}.seg button[aria-pressed=true]{background:var(--accent);color:var(--on-accent,#1a1205);font-weight:600}
/* Encabezado con el balancín (igual que StrataFlow) */
.stripe{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:500;padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:12px}
.bn { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 12px; padding: 22px 22px 52px; min-height: 160px; background: linear-gradient(100deg, #021b31 0%, #032c4d 55%, #054c71 100%); color: var(--fg); }
.bn > *:not(.bn-art) { position: relative; z-index: 1; }
.bn > :last-child { position: static; }
.bn-art { position: absolute; top: 0; right: 0; bottom: 0; width: min(62%, 640px); pointer-events: none; -webkit-mask-image: linear-gradient(to right, transparent 0, #000 38%); mask-image: linear-gradient(to right, transparent 0, #000 38%); }
.bn-art svg { width: 100%; height: 100%; display: block; }
.bn-beam { transform-origin: 300px 66px; animation: bnRock 2.2s ease-in-out infinite alternate; }
.bn-rod { animation: bnRod 2.2s ease-in-out infinite alternate; }
.bn-crank { transform-origin: 332px 100px; animation: bnSpin 4.4s linear infinite; }
.bn-flame { transform-origin: 464px 81px; animation: bnFlick 1.1s ease-in-out infinite alternate; }
.bn-flame2 { animation-duration: .7s; }
@keyframes bnRock { from { transform: rotate(-6deg); } to { transform: rotate(6deg); } }
@keyframes bnRod { from { transform: translateY(6px); } to { transform: translateY(-6px); } }
@keyframes bnSpin { to { transform: rotate(360deg); } }
@keyframes bnFlick { from { transform: scale(.92, .8); opacity: .85; } to { transform: scale(1.05, 1.12); opacity: 1; } }
@media (max-width: 640px) {
  .bn { padding: 14px 14px 12px; min-height: 0; }
  .bn > :last-child { display: contents; }
  .bn > :last-child > :first-child { order: 1; }
  .bn-art { position: relative; order: 2; flex: 0 0 100%; width: auto; height: 120px; margin: 6px -14px 0; opacity: 1; -webkit-mask-image: linear-gradient(to right, transparent 0, #000 10%); mask-image: linear-gradient(to right, transparent 0, #000 10%); }
}
@media (prefers-reduced-motion: reduce) { .bn-beam, .bn-rod, .bn-crank, .bn-flame { animation: none; } }
.bn{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}.bn h1{margin:4px 0 0}.bn .sub{margin-top:2px}
</style>

      list.appendChild(el('div', { class: 'scroll' }, el('table', {}, el('thead', {}, el('tr', {}, el('th', { text: t('date') }), el('th', { text: t('project') }), el('th', { text: t('activity') }), el('th', { text: t('hours') }))), tb)));
    });
    var bar = el('div', { style: 'position:fixed;right:10px;bottom:10px;z-index:9999;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;box-shadow:0 2px 10px rgba(2,27,49,.25);padding:6px 10px;font:12px sans-serif;display:flex;gap:10px;align-items:center' }, el('span', { text: (me.disp || me.email || '') + ' · SAI' }),
      el('button', { type: 'button', text: t('exit'), style: 'background:var(--accent);color:var(--on-accent,#021b31);border:0;border-radius:5px;padding:3px 8px;cursor:pointer;font:600 12px sans-serif', onclick: function () { sb.auth.signOut().then(function () { location.reload(); }); } }));
    (tabSel === 'pb' || tabSel === 'docs' ? [top, tabs, bar] : [top, tabs, form, list, bar]).forEach(function (n) { app.appendChild(n); });
  }

  async function submit() {
    var h = parseFloat(String(draft.horas).replace(',', '.')), pr = draft.project.trim(), ac = draft.activity.trim(), dt = draft.date;
    msg = null;
    if (!dt) msg = { t: t('fDate') }; else if (dt > today()) msg = { t: t('fFut') }; else if (!pr) msg = { t: t('fProj') }; else if (!ac) msg = { t: t('fAct') }; else if (!(h >= 0.25 && h <= 24)) msg = { t: t('fHrs') };
    if (msg) return render();
    if (!confirm(t('confirm').replace('{h}', nf(h)).replace('{d}', fd(dt)))) return;
    busy = true; render();
    var doc = { owner: me.id, ownerName: me.disp || me.email || '', date: dt, week: monday(dt), project: pr, activity: ac, horas: h, note: draft.note.trim(), created: new Date().toISOString() };
    var r = await sb.from('app_docs').insert({ collection: 'pm_horas', doc_id: 'pm' + uid(), data: doc, updated_by: me.id });   // solo INSERT: sin upsert, sin update, sin delete
    busy = false;
    if (r.error) msg = { t: t('fail') + (r.error.message || r.error.code) };
    else { msg = { ok: true, t: t('saved') }; draft = { date: dt, project: pr, activity: '', horas: '', note: '' }; await load(); }
    render();
  }
  async function load() {
    var r = await sb.from('app_docs').select('doc_id,data').eq('collection', 'pm_horas');
    if (r.error) { msg = { t: t('fail') + r.error.message }; return; }
    rows = (r.data || []).map(function (x) { return x.data; }).filter(function (d) { return d && d.owner === me.id; });
  }
  load().then(render);
  if (window.PB) {
    PB.core.start();
    PB.core.ls.push(function () { var b = document.getElementById('pbbadge'); if (b) { b.textContent = String(PB.core.unread); b.style.display = PB.core.unread ? '' : 'none'; } });
    PB.core.newCb.push(function (m) { var d = document.createElement('div'); d.setAttribute('role', 'status'); d.textContent = '💬 ' + m; d.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:56px;background:#16242b;border:1px solid #f0a540;border-radius:8px;padding:8px 14px;z-index:10002;font-size:13px'; document.body.appendChild(d); setTimeout(function () { d.remove(); }, 5000); });
  }
})();
